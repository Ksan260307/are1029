<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Number Road">
  <meta name="theme-color" content="#8fd1ff">
  <title>Number Road</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="TemplateData/icon-192.png">
  <link rel="apple-touch-icon" href="TemplateData/icon-180.png">
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #8fd1ff; }
    body {
      touch-action: none; overscroll-behavior: none;
      -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    #unity-canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; background: #8fd1ff; outline: none; }
    #loader {
      position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
      background: linear-gradient(#8fd1ff, #4f9fe6); color: #fff; transition: opacity .4s;
    }
    #loader img { width: 120px; height: 120px; border-radius: 26px; box-shadow: 0 8px 24px rgba(0, 0, 0, .25); }
    #loader h1 { margin: 0; font-size: 34px; letter-spacing: 2px; text-shadow: 0 3px 0 #1d3f86; }
    #bar { width: min(70vw, 360px); height: 16px; border-radius: 8px; background: rgba(0, 0, 0, .25); overflow: hidden; }
    #fill { width: 0; height: 100%; background: #ffc53a; border-radius: 8px; transition: width .2s; }
    #msg { font-size: 14px; opacity: .9; max-width: 80vw; text-align: center; }
  </style>
</head>
<body>
  <canvas id="unity-canvas" tabindex="-1"></canvas>
  <div id="loader">
    <img src="TemplateData/icon-192.png" alt="">
    <h1>Number Road</h1>
    <div id="bar"><div id="fill"></div></div>
    <div id="msg">Loading...</div>
  </div>
  <script>
    (function () {
      var canvas = document.getElementById("unity-canvas");
      var loader = document.getElementById("loader");
      var fill = document.getElementById("fill");
      var msg = document.getElementById("msg");
      var buildUrl = "Build";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/WebGLBuild.data.unityweb",
        frameworkUrl: buildUrl + "/WebGLBuild.framework.js.unityweb",
        codeUrl: buildUrl + "/WebGLBuild.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Ksan",
        productName: "Number Road",
        productVersion: "0.1.3",
        // full resolution is wasted on 3x phone screens; 2x keeps it sharp and fast
        devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2),
        // save data (PlayerPrefs) is synced to IndexedDB automatically
        autoSyncPersistentDataPath: true,
        showBanner: function (text, type) {
          if (type === "error") msg.textContent = text;
          console.warn(text);
        }
      };

      canvas.addEventListener("contextmenu", function (e) { e.preventDefault(); });
      document.addEventListener("gesturestart", function (e) { e.preventDefault(); });

      var script = document.createElement("script");
      script.src = buildUrl + "/WebGLBuild.loader.js";
      script.onload = function () {
        createUnityInstance(canvas, config, function (progress) {
          fill.style.width = Math.round(progress * 100) + "%";
        }).then(function () {
          loader.style.opacity = "0";
          setTimeout(function () { loader.remove(); }, 450);
        }).catch(function (error) {
          msg.textContent = String(error);
        });
      };
      script.onerror = function () { msg.textContent = "Failed to load the game files."; };
      document.body.appendChild(script);
    })();
  </script>
</body>
</html>
